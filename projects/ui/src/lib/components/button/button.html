<button
  class="rounded-md font-semibold transition"
  [ngClass]="{
    'bg-content-primary text-text-primary hover:bg-content-primary/80': variant === 'primary',
    'bg-content-secondary text-text-secondary hover:bg-content-secondary/80':
      variant === 'secondary',

    'px-2 py-1 text-sm': size === 'sm',
    'px-4 py-2 text-md': size === 'md',
    'px-6 py-3 text-lg': size === 'lg',
  }"
>
  <ng-content></ng-content>
</button>
