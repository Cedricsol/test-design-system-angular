<div
  [ngClass]="{
    'overflow-auto': variant === 'scrollable',

    'max-h-tableSm': size === 'sm',
    'max-h-tableMd': size === 'md',
    'max-h-tableLg': size === 'lg',
    'max-h-tableXl': size === 'xl',
  }"
>
  <table class="min-w-full border border-border rounded-md">
    <thead class="bg-content-primary sticky top-0 z-10">
      <tr>
        @for (col of columns; track col.key) {
          <th class="text-left px-4 py-2 text-sm font-semibold text-text-primary">
            {{ col.label }}
          </th>
        }
      </tr>
    </thead>
    <tbody class="bg-content-secondary">
      @for (row of data; track row) {
        <tr class="border-t hover:bg-hover-secondary transition">
          @for (col of columns; track col.key) {
            <td class="px-4 py-2 text-sm text-text-secondary">
              {{ row[col.key] }}
            </td>
          }
        </tr>
      }
    </tbody>
  </table>
</div>
